name: stage-changes
description: >-
  Stage the given pathspecs and report whether there is anything to commit, so
  callers can gate the commit step with `if:`.

inputs:
  paths:
    description: "Space-separated git pathspecs to stage (e.g. 'config.yaml')"
    required: true

outputs:
  changed:
    description: "'true' when staged changes exist, otherwise 'false'"
    value: ${{ steps.check.outputs.changed }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      run: |
        set -euo pipefail
        read -r -a pathspecs <<< "${{ inputs.paths }}"
        git add -- "${pathspecs[@]}"
        if git diff --cached --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "No changes to commit."
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Staged changes detected."
        fi
