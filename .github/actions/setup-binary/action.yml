name: setup-binary
description: >
  Download a release binary (mihomo / sing-box / yq) for linux-amd64 onto PATH.
  Uses a pinned default release tag unless an explicit version is supplied,
  then caches the binary by version; the installed version is checked.

inputs:
  tool:
    description: "Which binary to install: mihomo | sing-box | yq"
    required: true
  version:
    description: "Release tag to install; 'latest' maps to the pinned default"
    required: false
    default: latest

outputs:
  version:
    description: "The resolved release tag that was installed"
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - name: Resolve version
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.tool }}" in
          mihomo)   repo="MetaCubeX/mihomo"; default_version="v1.19.32" ;;
          sing-box) repo="SagerNet/sing-box"; default_version="v1.14.2" ;;
          yq)       repo="mikefarah/yq"; default_version="v4.54.1" ;;
          *) echo "ERROR: unknown tool '${{ inputs.tool }}'" >&2; exit 1 ;;
        esac

        ver="${{ inputs.version }}"
        [[ "$ver" != "latest" ]] || ver="$default_version"

        echo "repo=$repo"   >> "$GITHUB_OUTPUT"
        echo "version=$ver" >> "$GITHUB_OUTPUT"
        echo "Resolved ${{ inputs.tool }} -> $ver"

    - name: Restore from cache
      id: cache
      uses: actions/cache@v6
      with:
        path: /tmp/setup-binary/${{ inputs.tool }}
        key: setup-binary-${{ inputs.tool }}-${{ steps.resolve.outputs.version }}-linux-amd64

    - name: Download (cache miss)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        tool="${{ inputs.tool }}"
        repo="${{ steps.resolve.outputs.repo }}"
        ver="${{ steps.resolve.outputs.version }}"
        ver_bare="${ver#v}"

        dest="/tmp/setup-binary/${tool}"
        work="$(mktemp -d)"
        mkdir -p "$dest"

        case "$tool" in
          yq)
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://github.com/${repo}/releases/download/${ver}/yq_linux_amd64" \
              -o "${dest}/yq"
            chmod +x "${dest}/yq"
            "${dest}/yq" --version | grep -F "${ver}" >/dev/null
            ;;

          sing-box)
            asset="sing-box-${ver_bare}-linux-amd64.tar.gz"
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://github.com/${repo}/releases/download/${ver}/${asset}" \
              -o "${work}/sing-box.tar.gz"
            tar -xzf "${work}/sing-box.tar.gz" -C "${work}"
            bin="$(find "${work}" -type f -name sing-box -print -quit)"
            [[ -n "$bin" ]] || { echo "ERROR: sing-box binary not found in tarball" >&2; exit 1; }
            cp "$bin" "${dest}/sing-box"
            "${dest}/sing-box" version | grep -F "${ver_bare}" >/dev/null
            ;;

          mihomo)
            # Use the "compatible" build: runs on any x86-64 microarchitecture.
            # Build the asset URL directly so we do not depend on the GitHub
            # API (rate limits) or on jq being installed.
            url="https://github.com/${repo}/releases/download/${ver}/mihomo-linux-amd64-compatible-${ver}.gz"
            echo "Downloading mihomo: $url"
            if ! curl -fsSL --retry 3 --retry-delay 2 "$url" -o "${work}/mihomo.gz"; then
              echo "ERROR: failed to download ${url}" >&2
              exit 1
            fi
            gzip -df "${work}/mihomo.gz"
            cp "${work}/mihomo" "${dest}/mihomo"
            "${dest}/mihomo" -v || true
            ;;
        esac

        chmod +x "${dest}"/*
        rm -rf "${work}"

    - name: Add to PATH
      shell: bash
      run: |
        set -euo pipefail
        tool="${{ inputs.tool }}"
        dest="/tmp/setup-binary/${tool}"
        chmod +x "${dest}"/* 2>/dev/null || true
        echo "${dest}" >> "$GITHUB_PATH"

        # Tool-specific version probe. Never invoke the binary with an unknown
        # flag: mihomo treats that as "run the proxy" and would hang the step.
        case "$tool" in
          yq)       "${dest}/yq" --version || true ;;
          sing-box) "${dest}/sing-box" version || true ;;
          mihomo)   "${dest}/mihomo" -v || true ;;
        esac
